[build]
  base = "/"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # VITE_API_URL is set in the Netlify dashboard → Site settings → Environment variables
  # DO NOT set it here — a blank value here overrides the dashboard value at build time

# SPA fallback — redirect all paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
